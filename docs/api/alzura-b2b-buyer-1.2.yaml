    /buyer/ratings/seller:
        get:
            tags:
                - ratings
            summary: 'Get supplier ratings.'
            description: 'Returns the rating of all suppliers from the logged in buyer with the rating itself as well as the date the rating was made.'
            operationId: getRatingListFromSuppliersForBuyer
            parameters:
                -
                    name: filter
                    in: query
                    required: false
                    schema:
                        type: array
                        items:
                            properties:
                                supplier_id:
                                    description: |
                                        The ID of the supplier / seller.

                                        Allowed operators are:

                                        | operator | example |
                                        | ------ | ------ |
                                        | `eq` | `eq;john doe` |
                                        | `neq` | `neq;doe john` |
                                        | `in` | `in;john,jane,doe` |
                                        | `nin` | `nin;john,jane,doe` |
                                    type: string
                            type: object
                -
                    name: sort
                    in: query
                    description: |
                        Sort the result of your search.

                        _If the key to sort starts with a **-**, then the result is sorted in descending order._
                        _If the sort key starts with a **+** or only the key is specified, the result is sorted in ascending order._

                        Available sorters:

                        | name | description | example |
                        | ------ | ----------- | ------- |
                        | supplier_id | Sort by supplier_id. | -supplier_id |
                    required: false
                    schema:
                        type: string
                    example: '-supplier_id'
                -
                    name: limit
                    in: query
                    description: |-
                        Limit your search to list only a specific amount of records.

                        If you leave the field blank, `10` records will be returned by default.
                    required: false
                    explode: true
                    schema:
                        type: integer
                    example: 10
                -
                    name: offset
                    in: query
                    description: |-
                        Paginate the result of your search.

                        _If **limit** is not being passed, the value passed to offset will be ignored._
                    required: false
                    explode: true
                    schema:
                        type: integer
                    example: 0
            responses:
                '200':
                    description: 'The rating of the suppliers.'
                    content:
                        application/json:
                            schema:
                                properties:
                                    data: { type: array, items: { $ref: '#/components/schemas/ResponseSupplierRating' } }
                                    meta: { description: 'Pagination information.', required: [count], properties: { count: { description: 'Number of records found.', type: integer, example: 42 }, limit: { description: 'Maximum number of records returned.', type: integer, example: 10 }, offset: { description: 'Offset for the first record to return.', type: integer, example: 0 } }, type: object }
                                type: object
                '401':
                    description: 'Authentication failure.'
                    content:
                        application/json:
                            schema:
                                properties:
                                    data: { $ref: '#/components/schemas/AccessControlErrorResponse' }
                                type: object
            deprecated: false
            security:
                -
                    X-AUTH-TOKEN: []
                -
                    OAuthAccessToken:
                        - order
components:
    schemas:
        AccessControlErrorResponse:
            title: AccessControlErrorResponse
            properties:
                error:
                    description: 'The authentication error code.'
                    type: string
                    example: ERR_AUTHENTICATION_FAILURE
            type: object
        GuaranteedDeliveryResponse:
            title: GuaranteedDeliveryResponse
            required:
                - requested_by
                - creation_date
            properties:
                requested_by:
                    description: |-
                        Who requested the guaranteed delivery.

                        The guaranteed delivery can be requested by the following types:

                        | Type |
                        | ------ |
                        | Customer |
                        | System |
                        | Name of the Backoffice user, who requested the guaranteed delivery |
                    type: string
                    example: User
                creation_date:
                    description: 'When the guaranteed delivery contract was created.'
                    type: string
                    example: '2024-11-05T14:55:44+01:00'
            type: object
        FormResponseEmptyBody:
            title: EmptyBody
            type: object
        MessageIds:
            title: MessageIds
            required:
                - message_ids
            properties:
                message_ids:
                    description: 'The message ids'
                    type: array
                    example:
                        - 314159
                        - 265359
                    items:
                        type: integer
            type: object
        B2bFormError:
            title: B2bFormError
            required:
                - error_code
                - error_message
            properties:
                error_code:
                    description: 'Generic error code'
                    type: string
                    example: ERR_EXAMPLE_ERROR
                error_message:
                    description: 'Translation of error code'
                    type: string
                    example: 'This is a translation for the ERR_EXAMPLE_ERROR'
            type: object
        ResponseSupplierRating:
            title: SupplierRating
            required:
                - seller_id
            properties:
                seller_id:
                    description: 'The seller id that was rated.'
                    type: integer
                    example: 22445
                rating:
                    description: |-
                        The rating the buyer gives the seller.

                        | Rating | Meaning |
                        | ------ | ------ |
                        | 1 | Good |
                        | 0 | Bad |
                    type: integer
                    example: 1
                date:
                    description: 'The date when the rating was added.'
                    type: string
                    example: '2019-05-14 09:38:42'
            type: object
    securitySchemes:
        API-Key:
            type: apiKey
            description: |-
                You gain access to administrative endpoints by using an API key. This authentication is for internal usage.
                ### Examples of an authentication error

                The `HTTP status code` in case of an authentication error will be `401 Unauthorized` and the following response will be returned.
                ```json
                {
                  "data": {
                       "error": "ERR_AUTHENTICATION_FAILURE"
                  }
                }
                ```

                If a user tries to call an endpoint, for which he/she does have the required role, the following response, with `HTTP status code` `401 Unauthorized`, will be returned.
                ```json
                {
                  ""data"": [
                      {
                          "error_code": "ERR_AUTHENTICATION_FORBIDDEN",
                          "error_message": "You do not have access to this endpoint."
                      }
                  ]
                }
                ```
            name: X-API-KEY
            in: header
        basicAuth:
            type: http
            description: |-
                As a retailer or supplier you can use your credentials to gain access to the ```/common/login``` endpoint.
                ```text
                Authorization: Basic base64 encoded(customer-id:password)
                ```
                ### Example of an authentication error
                The `HTTP status code` in case of an authentication error will be `401 Unauthorized` and the following response will be returned.
                ```json
                {
                 "data": {
                     "error": "ERR_AUTHENTICATION_FAILURE"
                 }
                }
                ```
            scheme: basic
        basicAuthOperator:
            type: http
            description: |-
                Use basic HTTP authentication. As an operator use operator id and password. As a customer use email and password.
                ```text
                Authorization: Basic base64 encoded(customer-id:password)
                ```
            scheme: basic
        X-AUTH-TOKEN:
            type: apiKey
            description: |-
                Endpoints that require this authentication must send  `X-AUTH-TOKEN` in header. To get such an X-AUTH-TOKEN see `/common/login` endpoint for further information.

                ```text
                X-AUTH-TOKEN: some-valid-x-auth-token
                ```

                ### Examples of an authentication error
                The `HTTP status code` in case of an authentication error will be `401 Unauthorized` and the following response will be returned.
                ```json
                {
                  "data": {
                       "error": "ERR_AUTHENTICATION_FAILURE"
                  }
                }
                ```

                If a user tries to call an endpoint, for which he/she does have the required role, the following response, with `HTTP status code` `401 Unauthorized`, will be returned.
                ```json
                {
                  "data": [
                      {
                          "error_code": "ERR_AUTHENTICATION_FORBIDDEN",
                          "error_message": "You do not have access to this endpoint."
                      }
                  ]
                }
                ```
            name: X-AUTH-TOKEN
            in: header
        X-AUTH-TOKEN-OPERATOR:
            type: apiKey
            description: |-
                Endpoints that require this authentication must send  `X-AUTH-TOKEN` in header. To get such an X-AUTH-TOKEN see `/operator/login` endpoint for further information.
                ```text
                X-AUTH-TOKEN: some-valid-x-auth-token
                ```

                ### Examples of an authentication error
                The `HTTP status code` in case of an authentication error will be `401 Unauthorized` and the following response will be returned.
                ```json
                {
                  "data": {
                    "error": "ERR_AUTHENTICATION_FAILURE"
                  }
                }
                ```

                If a user tries to call an endpoint, for which he/she does have the required role, the following response, with `HTTP status code` `401 Unauthorized`, will be returned.
                ```json
                {
                  "data": [
                      {
                          "error_code": "ERR_AUTHENTICATION_FORBIDDEN",
                          "error_message": "You do not have access to this endpoint."
                      }
                  ]
                }
                ```
            name: X-AUTH-TOKEN
            in: header
        OAuthAccessToken:
            type: http
            description: 'The authentication is done by providing a json web token which represents an OAuth Access token provided by the alzura-oauth server.'
            bearerFormat: JWT
            scheme: bearer
