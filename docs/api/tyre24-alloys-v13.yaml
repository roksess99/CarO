definitions:
  distributorProfile:
    type: object
    required:
      - country
      - countryCode
      - name
      - images
      - description
      - street
      - city
      - orderTerms
      - deliveryTerms
    properties:
      country:
        type: string
        description: "country of the distributor"
      countryCode:
        type: string
        description: "2-letter ISO code of the distributors country"
      name:
        type: string
        description: "The name of the distributor"
      images:
        type: array
        items:
          $ref: '#/definitions/imageUrl'
      description:
        type: string
        description: "A description of the distributor"
      street:
        type: string
        description: "street of the distributor"
      city:
        type: string
        description: "city of the distributor"
      orderTerms:
        type: string
        description: "order terms of the distributor"
      deliveryTerms:
        type: string
        description: "delivery terms of the distributor"
  distributor:
    type: object
    required:
      - distributorId
      - distributorType
      - hasProfile
      - dataList
      - country
      - countryCode
      - name
      - priceList
      - orderTerms
      - neutralShippingCosts
      - positiveRating
      - supplierLikeStatus
    properties:
      distributorId:
        type: integer
        description: The internal id of the distributor
      distributorType:
        type: integer
      hasProfile:
        type: boolean
      dataList:
        type: array
        description: >-
          Contains distributor specific values of matching and supported data. see <a href="https://alzura-ag.atlassian.net/wiki/spaces/AI/pages/1676935169/Alloy+Distributor+List+-+Possible+Datalist+Values" target="_blank">Full list of possible values here</a>
        items:
          $ref: '#/definitions/distributorData'
      country:
        type: string
        description: The name of the country e.g. Deutschland
      countryCode:
        type: string
        description: The 2-letter country iso-code e.g. de
      name:
        type: string
        description: The name of the distributor
      stock:
        type: integer
        description: The stock of the distributor
      priceList:
        type: array
        items:
          $ref: '#/definitions/priceListValue'
      orderTerms:
        type: string
      deliveryTerms:
        type: string
      neutralShippingCosts:
        type: number
        format: float
        description: "delivery costs for different shipping address or neutral shipping"
      shippingCosts:
        type: array
        items:
          $ref: '#/definitions/shippingCosts'
      in_range:
        type: string
      pickup_date:
        type: string
      pickup_possible:
        type: integer
      pickup_preparation_time:
        type: string
      is_premium_supplier:
        type: string
      positiveRating:
        type: integer
      supplierLikeStatus:
        type: string
        enum: [positive, negative, neutral]
        default: neutral
        description: "Dealer's personal rating for this supplier"
  distributorData:
    type: object
