      name:
        type: string
      supported:
        type: boolean
      matching:
        type: boolean
  priceListValue:
    type: object
    required:
      - value
      - country_code
      - type
      - currency
    properties:
      id:
        type: string
        description: a unique identifier, can be ignored
        example: 18
      value:
        type: string
        format: float
        description: "The price itself."
        example: "77.75"
      country_code:
        type: string
        description: 2-letter iso-code e.g. de
        example: "de"
      currency:
        type: string
        description: 3-letter iso currency code e.g. EUR
        example: "EUR"
      type:
        type: string
        description: |
          The type of the price. Possible values are:
          * evp_list_[1-5|99]
          * rear_evp_list_[1-5|99]
          * set_evp_list_[1-5|99]
          * ek_front
          * ek_rear
          * ek_set
          
          The abbreviation `evp` is the German term `empfohlener Verkauspreis` which is the `recommended retail price`.
          The price lists configuration `evp_list_[1-5|99]`, `rear_evp_list_[1-5|99]`, and `set_evp_list_[1-5|99]` can be configured in your price [calculation](https://tyre24.alzura.com/de/de/user/masterdata/edit/calculation)
          The abbreviation `ek` is the German term `Einkaufpreis` which is the `purchase price`.
        example: "evp_list_3"
      min_order:
        type: integer
        description: The minimum quantity you have to order to get the mentioned price.
