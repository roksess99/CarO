        properties:
          price:
            type: array
            items:
              $ref: "#/definitions/priceListValue"
  imageUrl:
    type: object
    properties:
      URL:
        type: string
        description: >-
          An url to the image. Example URL can be `https://media3.tyre-shopping.com/dryd/907/302/1/1/3/1/4/0001-%s-%s.jpg`
          The URL may contain a placeholder `%s-%s` as shown in the example.
          You need to replace it, with your preferred resolution of the image. E.x. `w500-h500` (= width 500px and height 500px).
          The ratio of the original image will be kept if you provide a resolution that doesn't fit the ratio.
        example: "https://media3.tyre-shopping.com/dryd/907/302/1/1/3/1/4/0001-%s-%s.jpg"
