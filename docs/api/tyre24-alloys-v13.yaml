swagger: '2.0'
info:
  version: '1.3'
  title: Tyre24.com REST API Version 1.3 Alloys
  description: |
    All API commands need a TOKEN. Please refer to the additional documentation.
    
    
    # How to fetch a valid carID
    
    For some endpoints, like [GET /details](#/paths/~1details/get), 
    [GET /filter](#/paths/~1filter/get), [GET /images](#/paths/~1images/get), 
    [GET /search](#/paths/~1search/get) or 
    [GET /rimMatchingAlloyRims](#/paths/~1rimMatchingAlloyRims/get) you need a valid `carID` to be able to send a request.
    
    A car and its related `carID` is determined by fetching the response of all car brands. 
    With a car brand you can fetch all car models related to that car brand.
    Finally with your car brand and car model you can fetch all car types to identify a unique car or `carID`.
    
    ## Step 1: Fetch the car brand
    The response of the endpoint [GET /carBrands](#/paths/~1carBrands/get) contains a list of car brands.
    Each brand has a unique identifier, the `brandID`. This `brandID` must be used to call further endpoints. 
    Call this endpoint, choose your preferred car brand and make a note of the `brandID`.
    
    ## Step 2: Fetch the car models
    The response of the endpoint [GET /carModels](#/paths/~1carModels/get) contains a list of car models.
    The endpoint requires a valid `brandID` as query parameter, which you can fetch as described in [Step 1](#section/How-to-fetch-a-valid-carID/Step-1:-Fetch-the-car-brand).
    The endpoint documentation can be found in [GET /carBrands](#/paths/~1carBrands/get).
    Each car model has a unique identifier, the `modelID`. This `modelID` must be used to call further endpoints.
    Call this endpoint, choose your preferred car model and make a note of the `modelID`.
    
    ## Step 3: Fetch the car types
    The response of the endpoint [GET /carTypes](#/paths/~1carTypes/get) contains a list of car types.
    The endpoint requires a valid `brandID` and `modelID` combination, which you already fetched in [Step 1](#section/How-to-fetch-a-valid-carID/Step-1:-Fetch-the-car-brand) and [Step 2](#section/How-to-fetch-a-valid-carID/Step-2:-Fetch-the-car-models).
    Each car type has a unique identifier, the `carID`. This `carID` must be used to call further endpoints.
    
    Additionally you gather further information depending on your needs.
    
    `threed` indicates if the car type support 3D images. If it's `true` the `threedCarID` is the unique identifier
    of the 3D car, which can be used in further endpoints.  
    
    Furthermore the `colors` in the response provides information about all supported colors `colors.color` and the default
    color is returned in `colors.defaultColor`. Each color has 2 identifiers. First the `id` itself, which is the
    unique identifier of the color, and Second the `t24MaterialId` the unique identifier of the color to be used for 3D images. 
    
    
    # How to fetch alloys that matches your car
    There are several ways to find alloy wheels that fits to your car. With the endpoints [GET /rimMatchingAlloyRims](#/paths/~1rimMatchingAlloyRims/get)
    and [GET /search](#/paths/~1search/get) you are able to fetch fitting alloy wheel to your car. Both endpoints
    needs the `carID` and in case you want to fetch 3D alloy wheel you need to provide the `threedCarID`. In the section
    [How to fetch a valid carID](#section/How-to-fetch-a-valid-carID) is already described how you can fetch those 2 identifiers.
    The `carID` is always required, as the `threedCarID` is optional only in case you want to fetch 3D alloy wheel.
    
    
    
    # How to fetch (3D) images for a car
    To be able to use the endpoint [GET /images](#/paths/~1images/get) you need to determine a valid `carID`.
    For retrieving 3D images you need to determine the `threedCarID`.
    This is described already in [How to fetch a valid carID](#section/How-to-fetch-a-valid-carID).
    
    ## Default values that you should use
    The endpoint [GET /images](#/paths/~1images/get) has some parameters that are required, but you should set them to the mentioned default values.
    Here `scene` should be set to `1` and `screen` should be set to `4`. For now we do not have any further detailed explanation for those values.
    
    ## Decide which images you want to fetch
    The endpoint supports different types of images. The image urls will only be within the response, if we can provide image links and if you requested them within your request.

    You can view the car with the selected alloy and the color in a 3D rotation. We provide images with 36 evenly rotated steps.
    On the one hand, just the car with its color; on the other hand, the alloy with the tyre and its shadow.
    Both images together will ending up in the final image. The response contains a `threedCarImages` list. Those images only show the car with its color and its background.  The response contains furthermore the `threedAlloyImages` list. Those images show only the tyre, the alloy and has a transparent background.
    Therefore you need to set within your request `threedCarImages` and `threedAlloyImages` to `1`. You will fetch a list of 36 images each, for `threedCarImages` and `threedAlloyImages`. 
    As an example, select the fifth image of each list. These are treated as layers, superimposed on top of one another, and blended together. This produces the final image.
    
    Setting `rotaryImages` to `1` will return 36 images, each rotated in 10 degrees to get a full 360 degree turn of the alloy.
    
    Set `alloyImages` to `1` and a list of alloy images with the background removed, will be returned.
    
    Set `emoticleImages` to `1` and a list of images with some close up details of the alloy will be returned.
    
    Set `HDRI` to `1` will return a list of High Dynamic Range Images, that show the rendered 3D car in different backgrounds. See [example](https://tyre24.alzura.com/de/de/alufelgen/3d-konfigurator/bmw/f34xm-x4%20m-1571-3644/flamencorot%20brillant%20metallic-176-1779/diewe%20wheels-trina-850-19-zoll-850-30-30-5-11200-6660-platin%20%20platin%20matt-835-835-145275-0/#carGallery-8)
    
    # A full working example to fetch 3D images for a car.
    
    ## Step 1: Get a brand that supports 3D images
    Using the endpoint [GET /carBrands](#/paths/~1carBrands/get) to fetch all car brands. The response looks similar to this:
    ```
    {
      "alloyRimCarBrandsList": [
        {
            "brandID": 70,
            "brand": "Aiways",
            "threed": false
        },
        ...
        {
            "brandID": 22,
            "brand": "BMW",
            "threed": true
        },
        ...
    }
    ```
    I choose the brand `BMW` as i want to receive at a later point 3D images of a 3D BMW car.
    The `brandID` we need to use for further endpoints is: `22`
    
    ## Step 2: Get the car models for BMW
    Using the endpoint [GET /carModels](#/paths/~1carModels/get) and set `brandID=22` in the query parameters to fetch all car models of the car brand `BMW`.
    The response looks similar to this:
    ```
    {
      "alloyRimCarModelsList": [
        ...
        {
            "modelID": 666,
            "model": "6er Reihe",
            "threed": true
        },
      ...
    }
    ```
    The `modelID` for a BMW 6er Reihe is `666`.
    
    ## Step 3: Get all car types for a BMW 6er Reihe
    Using the endpoint [GET /carTypes](#/paths/~1carTypes/get) and set as `brandID=22` and as `modelID=666`  in the query parameters to fetch all car types for a `BMW 6er Reihe`.
    The response looks similar to this:
    ```
    {
      "alloyRimCarTypesList": [
        {
            "carID": 3231,
            "carType": "G6GT",
            "carTypeDesc": "G32",
            "carComment": "Gran Turismo",
            "holeNumber": 5,
            "holeCircle": "112.00",
            "hubHole": "66.60",
            "permitNumber": "e1*2007/46*1791*08..",
            "carPic": "https://media3.tyre-shopping.com/images/carpic/cp_3231_nobr-soap_search_v1-w%-h%.jpg",
            "threed": true,
            "threedCarID": 907,
            "colors": {
                "color": [
                    {
                        "id": 3691,
                        "t24MaterialId": "561",
                        "desc": "Bluestone metallic",
                        "image": {
                            "URL": "https://media1.tyre-shopping.com/images/3dmaterials/561_nobr-R-%s-%s.jpg"
                        }
                    },
                    ...
                ],
                "defaultColor": [
                    {
                        "id": 5020,
                        "t24MaterialId": "302",
                        "desc": "Piemont Rot Metallic",
                        "image": {
                            "URL": "https://media2.tyre-shopping.com/images/3dmaterials/302_nobr-R-%s-%s.jpg"
                        }
                    }
                ]
            },
            "additionalThreedData": {
                "brakeId": null,
                "axleDistance": "3070",
                "tyreDistanceFront": "1892",
                "tyreDistanceRear": "1911",
                "tyreRadius": "350",
                "platesId": "3",
                "brakesId": "1"
            },
            "tyrePressureMonitoringSystems": [],
            "manufactureYearFrom": "5.2020",
            "manufactureYearTo": "0.0"
        },
        ...
    }
    ```
    The `carType=G6GT` with its `carId=3231` for a `BMW 6er Reihe` support 3D images as `threed=true` and `threedCarID` has a valid identifier `907`.
    Additionally in the list of `colors` i am choosing not the default color, i am choosing the `Bluestone metallic` which has as `id=3691` and "t24MaterialId=561".
    
    ## Step 4: Search a 3D alloy wheel that fits to the car
    Using the endpoint [GET /search](#/paths/~1search/get) with the already gathered information for `carID` and `threedCarID` as query parameters (`carID=3231` and `threedCarID=907`).
    The response looks similar to this:
    ```
    {
      "alloyRimsList": [
        {
            "alloyRimFrontID": 152801,
            ...
            "alloyRimRearID": 0,
            ...
            "manufacturer": "AUTEC",
            "manufacturerDescription": "<p><strong>AUTEC Leichtmetallräder</strong> ist ein führender deutscher Hersteller von hochwertigen Aluminiumfelgen für den Pkw-Nachrüstmarkt in Europa. Die Marke steht für moderne und kreative Designs, die jedem Fahrzeug eine individuelle Note verleihen – von zeitlos-elegant bis sportlich und innovativ.</p>\r\n<p>Die Produktpalette von AUTEC umfasst eine Vielzahl von Felgendesigns in Größen von 14 bis 22 Zoll, passend für nahezu alle Lochkreise und Einpresstiefen. Alle Felgen sind von KBA und TÜV geprüft und zertifiziert, was höchste Qualitäts- und Sicherheitsstandards garantiert.</p>\r\n<p>AUTEC legt großen Wert auf Innovation und Qualität. Neben Aluminiumfelgen fertigt das Unternehmen auch Kompletträder und bietet Reifendruckkontrollsysteme (RDKS) für nahezu jedes Fahrzeug an.</p>\r\n<p> </p>\r\n<p> </p>\r\n<p><strong>Angaben zur Produktsicherheit:</strong></p>\r\n<p> </p>\r\n<p><strong>Hersteller:</strong></p>\r\n<p>AUTEC GmbH & Co. KG</p>\r\n<p>Ziegeleistraße 25</p>\r\n<p>67105 Schifferstadt</p>\r\n<p>Deutschland</p>",
            "type": "LAMERA (L) Schwarz Matt Poliert Einteilig",
            "typeName": "LAMERA (L)",
            "typeColor": "Schwarz Matt Poliert",
            "typeConstruction": "Einteilig",
            "axlePositionType": "VUH",
            "alloyTypeID": 6395,
            "alloyFilterTypeID": 6395,
            "alloyXrefID": 12514326,
            "threedCarInformation": {
                "widthFront": "7.50",
                "widthRear": "7.50",
                "diameter": "17",
                "rimIdFront": "1711",
                "rimIdRear": "1711",
                "offsetFront": "30",
                "offsetRear": "30"
            },
            "imageUrl": {
                "URL": "https://media1.tyre-shopping.com/images_ts/alloy/v3/6395/5/2_Freistellen-AUTEC-%s-%s-br0.png"
            },
            "threed": true,
            "groupedByDesign": false,
            "groupedByPrice": false,
            "priceList": [
                {
                    "id": "1",
                    "value": 105,
                    "country_code": "de",
                    "currency": "EUR",
                    "type": "evp_list_1",
                    "min_order": 1 
                },
                ...
            ]
        },
      ...
    }
    ```
    The required value to get 3D images is `alloyRimFrontID` in the response (`152801`).
    
    ## Step 5: Get the 3D images.
    Using the endpoint [GET /images](#/paths/~1images/get) to finally retrieve the 3D images.
    With your gathered information you can set as query parameters: `carId=3231`, `threedCarID=907`, `frontAlloyId=152801` and `colorID=561`.
    You should set as default: `scene=1` and `screen=4`.
    To fetch all kind of images that our systems provides you should set additionally: `alloyImages=1`, `emoticleImages=1`, `HDRI=1`, `rotaryImages=1`, `threedAlloyImages=1` and `threedCarImages=1`.
    Your request url may look like
    ```
      /images?alloyImages=1&carID=3231&colorID=561&emoticleImages=1&frontAlloyID=152801&frontAlloyModelsID=&frontAlloyOffset&HDRI=1&rearAlloyID=&rearAlloyModelsID=&rearAlloyOffset&rotaryImages=1&scene=1&screen=4&threedAlloyImages=1&threedCarID=907&threedCarImages=1
    ```
    The response looks similar to this:
    ```
    {
      "threedCarImages": {
        "image": [
            {
                "URL": "https://media3.tyre-shopping.com/dryd/907/561/1/1/3/1/4/0001-%s-%s.jpg"
            },
            ...
        ]
      },
      "threedAlloyImages": {
        "image": [
            {
                "URL": "https://media4.tyre-shopping.com/dryd_rims2/907/75_75/1/1/75x17_75x17/1711_1711/30_30/0001-%s-%s.png"
            },
            ...
        ]
      },
      "HDRI": {
        "image": []
      },
      "emoticleImages": {
        "image": [
            {
                "URL": "https://media4.tyre-shopping.com/images/alloy/v3/6395/5/1_Details-AUTEC-%s-%s-br0.jpg"
            },
            ...
        ]
      },
      "rotaryImages": {
        "image": [
            {
                "URL": "https://media2.tyre-shopping.com/images/alloy/v3/6395/5/1-AUTEC-%s-%s-br0.jpg"
            },
            ...
        ]
      },
      "alloyImages": {
        "image": [
            {
                "URL": "https://media2.tyre-shopping.com/images/alloy/v3/6395/5/1_Freistellen-AUTEC-%s-%s-br0.png"
            },
            ...
        ]
      }
    }
    ```

host: tyre24.alzura.com
basePath: /de/de/rest/v13/alloys
schemes:
  - https
produces:
  - application/json
consumes:
  - application/json
securityDefinitions:
  tokenAuth:
    type: apiKey
    in: header
    name: X-AUTH-TOKEN
    description: |
      To enable you to log in to ALZURA.com via an interface using third-party systems
      such as your ERP, ERP, DMS or other systems, you generate a unique token [here](https://tyre24.alzura.com/de/de/tokenmanagement),
      which you store in the respective system in order to log in automatically.
      You only need this one token and can use it in several systems.

      **Managing Access with Your ALZURA Account**
        1. **Linked Platforms, Websites, and Apps**  
           - You use your ALZURA account to log in to various services, platforms, and applications.  

        2. **Access Permissions**  
           - When you log in using your ALZURA account, you grant these services access to certain data.  
           - This data may include confidential information.  

        3. **Where to Find Your Tokens**  
           - Follow these steps to locate and manage your tokens:  
             1. Log in to your ALZURA account.  
             2. Navigate to the [Token Management Page](https://tyre24.alzura.com/de/de/tokenmanagement).  

        4. **Token Validity and Expiration**  
           - A token determines how long you remain logged in to an external service.  
           - Once the token expires, you will need to log in again to refresh it.  

        5. **Re-establishing Access**  
           - If you remove access, you can log in again to the service at any time using your ALZURA account.  
           - Re-login will grant access to the service once more.  

      Once you have obtained your API-Token, use it in the X-AUTH-TOKEN header of your requests.
         Example:
        ```
          GET /api/v1/tyres HTTP/1.1
          X-AUTH-TOKEN:<your-api-token>
        ```
paths:
  /details:
    get:
      summary: /details
      parameters:
        - in: query
          name: alloyRimFrontID
          type: integer
          required: true
          description: "id of the alloy rim front"
        - in: query
          name: alloyRimRearID
          type: integer
          required: false
          description: "id of the alloy rim rear"
        - in: query
          name: carID
          required: true
          type: integer
          description: "id of the car"
        - in: query
          name: threedCarID
          type: integer
          required: false
          description: "The identifier of the 3D car. Required to retrieve 3D car information."
      description: "Returns the details of a requested alloy"
      security:
        - tokenAuth: []
      responses:
        200:
          description: Details of the Requested alloy.
          schema:
            $ref: '#/definitions/alloyDetailsList'
        403:
          description: >-
            The access to this endpoint is restricted for your user
            <br /><br/>
            The following error code will be returned:

            <table style="width: 100%; margin: 10px;" border="1" bordercolor="gray">
              <tr>
                <td style="padding-left: 5px; font-style: normal;"><p>ERR_RESTRICTED_ACCESS</p></td>
                <td style="padding-left: 5px;"><p>The access to this endpoint is not allowed for your user</p></td>
              </tr>
            </table>

  /filter:
    get:
      summary: /filter
      parameters:
        - in: query
          name: carID
          required: true
          type: integer
          description: "id of the car"
      description: >-
        The Tyre24 search offers various filters to narrow down a search result.
        For this purpose several filters can be requested before sending a
        search query which can then be used to influence the search results. The
        search contains all available filters and shows how many results would
        be affected by these filters.
      security:
        - tokenAuth: []
      responses:
        200:
          description: >-
            Returns all filters which can be used initially to modify the tyre
            search results.
          schema:
            $ref: '#/definitions/Filter'
        403:
          description: >-
            The access to this endpoint is restricted for your user
            <br /><br/>
            The following error code will be returned:

            <table style="width: 100%; margin: 10px;" border="1" bordercolor="gray">
              <tr>
                <td style="padding-left: 5px; font-style: normal;"><p>ERR_RESTRICTED_ACCESS</p></td>
                <td style="padding-left: 5px;"><p>The access to this endpoint is not allowed for your user</p></td>
              </tr>
            </table>

  /sorter:
    get:
      summary: /sorter
      description: >-
        By adding one of the following sorting filters, the order of search
        results can be changed. In case of sending an unknown or no sorting
        filter, the standard sorting (currently by price) will be used.
      security:
        - tokenAuth: []
      responses:
        200:
          description: Returns a list of all available sorting options.
          schema:
            $ref: '#/definitions/Sorter'
        403:
          description: >-
            The access to this endpoint is restricted for your user
            <br /><br/>
            The following error code will be returned:

            <table style="width: 100%; margin: 10px;" border="1" bordercolor="gray">
              <tr>
                <td style="padding-left: 5px; font-style: normal;"><p>ERR_RESTRICTED_ACCESS</p></td>
                <td style="padding-left: 5px;"><p>The access to this endpoint is not allowed for your user</p></td>
              </tr>
            </table>
  /carBrands:
    get:
      summary: /carBrands
      description: >-
        Returns a list of all available car brands.
      security:
        - tokenAuth: []
      responses:
        200:
          description: Returns a list of all available car brands.
          schema:
            $ref: '#/definitions/alloyRimCarBrandsList'
  /carModels:
    get:
      summary: /carModels
      parameters:
        - in: query
          name: brandID
          type: integer
          required: true
          description: >-
            Identifier of the car brand to fetch the associated car models.
            To get a valid `brandID`, see [GET /carBrands](#/paths/~1carBrands/get)
      description: >-
        Returns a list of all available car models for the requested car brand.
      security:
        - tokenAuth: []
      responses:
        200:
          description: A list of all available car models for the requested car brand.
          schema:
            $ref: '#/definitions/alloyRimCarModelsList'
        403:
          description: >-
            The access to this endpoint is restricted for your user
            <br /><br/>
            The following error code will be returned:

            <table style="width: 100%; margin: 10px;" border="1" bordercolor="gray">
              <tr>
                <td style="padding-left: 5px; font-style: normal;"><p>ERR_RESTRICTED_ACCESS</p></td>
                <td style="padding-left: 5px;"><p>The access to this endpoint is not allowed for your user</p></td>
              </tr>
            </table>
  /carTypes:
    get:
      summary: /carTypes
      parameters:
        - in: query
          name: brandID
          type: integer
          required: true
          description: >-
            Identifier of the car brand.
            To get a valid `brandID`, see [GET /carBrands](#/paths/~1carBrands/get)
        - in: query
          name: modelID
          type: integer
          required: true
          description: >- 
            Identifier of the car model.
            To get a valid `modelID`, see [GET /carModels](#/paths/~1carModels/get)
      description: >-
        Returns a list of all available car types for the requested car brand and car model.
        You need to use a valid combination of `brandID` and `modelID`. See [GET /carBrands](#/paths/~1carBrands/get) and [GET /carModels](#/paths/~1carModels/get)
      security:
        - tokenAuth: []
      responses:
        200:
          description: >-
            Returns a list of all available car types for the requested car brand and car model.
          schema:
            $ref: '#/definitions/alloyRimCarTypesList'
        403:
          description: >-
            The access to this endpoint is restricted for your user
            <br /><br/>
            The following error code will be returned:

            <table style="width: 100%; margin: 10px;" border="1" bordercolor="gray">
              <tr>
                <td style="padding-left: 5px; font-style: normal;"><p>ERR_RESTRICTED_ACCESS</p></td>
                <td style="padding-left: 5px;"><p>The access to this endpoint is not allowed for your user</p></td>
              </tr>
            </table>
  /images:
    get:
      summary: /images
      parameters:
        - in: query
          name: carID
          type: integer
          required: true
          description: >-
            The identifier of the car.
            See e.x. response of [GET /carTypes](#/paths/~1carTypes/get).
        - in: query
          name: threedCarID
          type: integer
          required: true
          description: >-
            The identifier of the 3D car. Required to retrieve 3D car information.
            See e.x. response of [GET /carTypes](#/paths/~1carTypes/get).
        - in: query
          name: colorID
          type: integer
          required: true
          description: >-
            The identifier of the 3D color.
            Warning: Risk of confusion with the identifier of the color! This is the identifier of the 3D color!
            See e.x. response of [GET /carTypes](#/paths/~1carTypes/get).
        - in: query
          name: frontAlloyID
          type: integer
          required: true
          description: "Identifier of the front alloy"
        - in: query
          name: frontAlloyOffset
          type: integer
          required: true
          description: "front alloy offset"
        - in: query
          name: frontAlloyModelsID
          type: integer
          required: true
          description: "Identifier of the front alloy model"
        - in: query
          name: rearAlloyID
          type: integer
          required: true
          description: "Identifier of the rear alloy"
        - in: query
          name: rearAlloyOffset
          type: integer
          required: true
          description: "rear alloy offset"
        - in: query
          name: rearAlloyModelsID
          type: integer
          required: true
          description: "rear alloy models id"
        - in: query
          name: screen
          type: integer
          required: true
          description: >- 
            The identifier of the screen. You should use `4` as default.
            At the moment there is no further explanation for the `screen`.
        - in: query
          name: scene
          type: integer
          required: true
          description: |
            The identifier of the screen. You should use `1` as default.
            At the moment there is no further explanation for the `scene`.
        - in: query
          name: threedCarImages
          type: integer
          required: false
          description: >-
            Image flag for 3D car images.
            This parameter must be set to 1 if you want to receive existing images in the response.
        - in: query
          name: threedAlloyImages
          type: integer
          required: false
          description: >- 
            Image flag for 3D alloy images.
            This parameter must be set to 1 if you want to receive existing images in the response.
        - in: query
          name: HDRI
          type: integer
          required: false
          description: >-
            Image flag for HDRI images.
            This parameter must be set to 1 if you want to receive existing images in the response.
        - in: query
          name: emoticleImages
          type: integer
          required: false
          description:
