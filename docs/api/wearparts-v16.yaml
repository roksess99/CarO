              </tr>
              <tr>
                <td style="text-align: center;"><p>3</p></td>
                <td style="padding-left: 5px;"><p>swedish NumberPlate</p></td>
              </tr>
              <tr>
                <td style="text-align: center;"><p>4</p></td>
                <td style="padding-left: 5px;"><p>swiss TypeNumber</p></td>
              </tr>
              <tr>
                <td style="text-align: center;"><p>5</p></td>
                <td style="padding-left: 5px;"><p>danish NumberPlate</p></td>
              </tr>
              <tr>
                <td style="text-align: center;"><p>6</p></td>
                <td style="padding-left: 5px;"><p>austrian NatCodes</p></td>
              </tr>
              <tr>
                <td style="text-align: center;"><p>7</p></td>
                <td style="padding-left: 5px;"><p>norwegian NumberPlate</p></td>
              </tr>
              <tr>
                <td style="text-align: center;"><p>8</p></td>
                <td style="padding-left: 5px;"><p>finnish NumberPlate</p></td>
              </tr>
              <tr>
                <td style="text-align: center;"><p>9</p></td>
                <td style="padding-left: 5px;"><p>DAT ECode</p></td>
              </tr>
              <tr>
                <td style="text-align: center;"><p>20</p></td>
