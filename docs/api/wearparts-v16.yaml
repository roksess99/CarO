              </tr>
              <tr>
                <td style="text-align: center;"><p>69</p></td>
                <td style="padding-left: 5px;"><p>swedish NumberPlate (Koivunen)</p></td>
              </tr>
              <tr>
                <td style="text-align: center;"><p>91</p></td>
                <td style="padding-left: 5px;"><p>italian NumberPlate (RT)</p></td>
              </tr>
              <tr>
                <td style="text-align: center;"><p>92</p></td>
                <td style="padding-left: 5px;"><p>danish NumberPlate (AIS)</p></td>
              </tr>
              <tr>
                <td style="text-align: center;"><p>93</p></td>
                <td style="padding-left: 5px;"><p>finnish NumberPlate (AIS)</p></td>
              </tr>
              <tr>
                <td style="text-align: center;"><p>94</p></td>
                <td style="padding-left: 5px;"><p>swedish NumberPlate (AIS)</p></td>
              </tr>
              <tr>
                <td style="text-align: center;"><p>95</p></td>
                <td style="padding-left: 5px;"><p>swedish NumberPlate</p></td>
              </tr>
              <tr>
                <td style="text-align: center;"><p>97</p></td>
                <td style="padding-left: 5px;"><p>norwegian NumberPlate (AIS)</p></td>
              </tr>
              <tr>
                <td style="text-align: center;"><p>99</p></td>
                <td style="padding-left: 5px;"><p>irish NumberPlate (IE-Cartell)</p></td>
              </tr>
