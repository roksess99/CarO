            others tbd.
        - in: query
          name: keySystemNumber
          type: string
          required: true
          description: Key system number
      responses:
        '200':
          description: Returns vehicle ids by searching with key system numbers.
          schema:
            type: array
            items:
              $ref: '#/definitions/VehicleByKey'
        '403':
          description: |-
            The access to this endpoint is restricted for your user <br /><br/> The following error code will be returned:
            <table style="width: 100%; margin: 10px;" border="1" bordercolor="gray">
              <tr>
                <td style="padding-left: 5px; font-style: normal;"><p>ERR_RESTRICTED_ACCESS</p></td>
                <td style="padding-left: 5px;"><p>The access to this endpoint is not allowed for your user</p></td>
              </tr>
            </table>
  /vehiclesByCarIds:
    get:
      summary: /vehiclesByCarIds
      produces:
        - application/json
      description: Returns vehicle details by searching with given carIds.
      security:
        - tokenAuth: []
      parameters:
        - in: query
          name: carId
          type: array
          required: true
          description: |-
            array of carId from /vehicles or /vehiclesByKey
      responses:
        '200':
          description: Returns vehicle details by searching with given carIds.
          schema:
            type: array
            items:
              $ref: '#/definitions/Vehicles'
        '400':
          description: |-
            <table style="width: 100%; margin: 10px;" border="1" bordercolor="gray">
              <tr>
                <td style="padding-left: 5px; font-style: normal;"><p>ERR_MISSING_MANDATORY_PARAMETER</p></td>
                <td style="padding-left: 5px;"><p>A mandatory parameter is missing</p></td>
              </tr>
            </table>
        '403':
          description: |-
            The access to this endpoint is restricted for your user <br /><br/> The following error code will be returned:
            <table style="width: 100%; margin: 10px;" border="1" bordercolor="gray">
              <tr>
                <td style="padding-left: 5px; font-style: normal;"><p>ERR_RESTRICTED_ACCESS</p></td>
                <td style="padding-left: 5px;"><p>The access to this endpoint is not allowed for your user</p></td>
              </tr>
            </table>
  /category:
    get:
      summary: /category
      produces:
        - application/json
      description: Returns a category tree.
      security:
        - tokenAuth: []
      parameters:
        - in: query
          name: carId
          description: Vehicle id from vehicle selection
          required: true
          type: integer
        - in: query
          name: parentNodeId
          required: false
          type: integer
        - in: query
          name: linkingTargetType
          description: >-
            defines the type

            <table style="width: 100px; margin: 10px;" border="1" bordercolor="gray">
              <tr>
                <td style="text-align: center;"><p>P</p></td>
                <td style="padding-left: 5px;"><p>PKW (default)</p></td>
              </tr>
              <tr>
                <td style="text-align: center;"><p>M</p></td>
                <td style="padding-left: 5px;"><p>Motor</p></td>
              </tr>
              <tr>
                <td style="text-align: center;"><p>O</p></td>
                <td style="padding-left: 5px;"><p>LKW</p></td>
              </tr>
            </table>
          required: false
          type: string
          default: 'P'
      responses:
        '200':
          description: Returns a category tree.
          schema:
            type: array
            items:
              $ref: '#/definitions/Category'
        '403':
          description: >-
            The access to this endpoint is restricted for your user
            <br /><br/>
            The following error code will be returned:

            <table style="width: 100%; margin: 10px;" border="1" bordercolor="gray">
              <tr>
                <td style="padding-left: 5px; font-style: normal;"><p>ERR_RESTRICTED_ACCESS</p></td>
                <td style="padding-left: 5px;"><p>The access to this endpoint is not allowed for your user</p></td>
              </tr>
            </table>

  /categoryBySearchString:
    get:
      summary: /categoryBySearchString
      produces:
        - application/json
      description: Returns a category tree by searching with a search string.
      security:
        - tokenAuth: []
      parameters:
        - in: query
          name: carId
          description: Vehicle id from vehicle selection
          required: true
          type: integer
        - in: query
          name: searchPattern
          description: Search string to search for
          required: true
          type: string
        - in: query
          name: linkingTargetType
          description: >-
            defines the type

            <table style="width: 100px; margin: 10px;" border="1" bordercolor="gray">
              <tr>
                <td style="text-align: center;"><p>P</p></td>
                <td style="padding-left: 5px;"><p>PKW (default)</p></td>
              </tr>
              <tr>
                <td style="text-align: center;"><p>M</p></td>
                <td style="padding-left: 5px;"><p>Motor</p></td>
              </tr>
              <tr>
                <td style="text-align: center;"><p>O</p></td>
                <td style="padding-left: 5px;"><p>LKW</p></td>
              </tr>
            </table>
          required: false
          type: string
          default: 'P'
      responses:
        '200':
          description: Returns a category tree by searching with a search string.
          schema:
            type: array
            items:
              $ref: '#/definitions/CategoryBySearchString'
        '403':
          description: >-
            The access to this endpoint is restricted for your user
            <br /><br/>
            The following error code will be returned:

            <table style="width: 100%; margin: 10px;" border="1" bordercolor="gray">
              <tr>
                <td style="padding-left: 5px; font-style: normal;"><p>ERR_RESTRICTED_ACCESS</p></td>
                <td style="padding-left: 5px;"><p>The access to this endpoint is not allowed for your user</p></td>
              </tr>
            </table>

  /articles:
    get:
      summary: /articles
      produces:
        - application/json
      description: >-
        Returns a list of all available articles for a specified article number.
      security:
        - tokenAuth: []
      parameters:
        - in: query
          name: search
          description: >-
            required for direct search / optional for category search<br>
            search term to use for direct searches or to narrow down results when using category search<br>
            searches in multiple fields internally and therefore will most likely lead to multiple results<br>
            if you know what you are looking for, you can use prefixes to limit searching in specific fields<br>
            prefixes are:
            <table>
              <tr><th>Prefix</th><th>Meaning</th><th>Example</th></tr>
              <tr><td>EAN</td><td>European Article Number</td><td>EAN5703858905415</td></tr>
              <tr><td>OEN</td><td>Original Equipment Number</td><td>OENA2115401717</td></tr>
              <tr><td>TNS</td><td>Trade Number Search</td><td>TNS14411-00Q0A</td></tr>
              <tr><td>AID</td><td>Article ID</td><td>AID04-10034-01</td></tr>
              <tr><td>ID</td><td>Product ID</td><td>ID9-30342d31303033342d3031</td></tr>
            </table>
          required: false
          type: string
        - in: query
          name: exact
          type: integer
          description: >-
            supported values 0,1 - default = 0<br>
            0 = is a 'like' search<br>
            1 = use exact search (only if a field exactly equals a search term a result will be found)<br>
        - in: query
          name: limit
          required: false
          type: integer
          description: limit the number of results
          default: 30
        - in: query
          name: page
          required: false
          type: integer
          description: used for pagination
          default: 0
        - in: query
          name: sort
          description: how to sort the results. see /sorters endpoint for valid values
          required: false
          type: string
          default: sort[price]=asc
        - in: query
          name: filter[category]
          description: >-
            required for category search<br>
            see /category endpoint to get category ids
          required: false
          type: integer
          example: 1534
        - in: query
          name: filter[carId]
          description: >-
            required for category search<br>
            see /vehicle* endpoints to get car ids
          required: false
          type: integer
          example: 130594
        - in: query
          name: filter[genericArticleId]
          description: >-
            used to get attributes and vehicle attributes in facets
          required: false
          type: integer
          example: 407
        - in: query
          name: filter[shipping][]
          description: >-
            used for getting only express offers<br>
            see /filterList endpoint for details<br>
            possible values are <ul>
              <li>"pickup"</li>
              <li>"truck_today"</li>
              <li>"truck_tomorrow"</li>
              <li>"package_today"</li>
              <li>"package_tomorrow"</li>
            </ul>
          required: false
          type: array
          items:
            type: string
          example: package_tomorrow
        - in: query
          name: filter[sellerId]
          description: a valid seller id to use as a filter
          required: false
          type: integer
          example: 1943
        - in: query
          name: filter["[key]"]
          description: see /filterList endpoint for details which "[key]" values are supported
          required: false
          type: array

      responses:
        '200':
          description: Returns a list of all available articles for a specified article number.
          schema:
            $ref: '#/definitions/Articles'
        '403':
          description: >-
            The access to this endpoint is restricted for your user
            <br /><br/>
            The following error code will be returned:

            <table style="width: 100%; margin: 10px;" border="1" bordercolor="gray">
              <tr>
                <td style="padding-left: 5px; font-style: normal;"><p>ERR_RESTRICTED_ACCESS</p></td>
                <td style="padding-left: 5px;"><p>The access to this endpoint is not allowed for your user</p></td>
              </tr>
            </table>

  /attributeNames:
    get:
      summary: /attributeNames
      produces:
        - application/json
      description: returns all available attribute names of the wearparts article search attr_* & vattr_* facets
      security:
        - tokenAuth: [ ]
      responses:
        '200':
          description: returns all available attribute names of the wearparts article search attr_* & vattr_* facets
          schema:
            type: object
            required:
              - "[attribute_id]"
            properties:
              "[attribute_id]":
                type: string
                description: attribute name
            example:
              '1': KBA-Nummer
              '2': TECDOC-PKW-Typnummer
              '3': Ausstattungsvariante
              '4': Raddurchmesser [Zoll]
        '403':
          description: >-
            The access to this endpoint is restricted for your user
            <br /><br/>
            The following error code will be returned:

            <table style="width: 100%; margin: 10px;" border="1" bordercolor="gray">
              <tr>
                <td style="padding-left: 5px; font-style: normal;"><p>ERR_RESTRICTED_ACCESS</p></td>
                <td style="padding-left: 5px;"><p>The access to this endpoint is not allowed for your user</p></td>
              </tr>
            </table>

  /filterList:
    get:
      summary: /filterList
      produces:
        - application/json
      description: Returns a list of all available filters.
      security:
        - tokenAuth: []
      parameters:
      responses:
        '200':
          description: Returns a list of all available filters for a specified category.
          schema:
            $ref: '#/definitions/FilterList'
        '403':
          description: >-
            The access to this endpoint is restricted for your user
            <br /><br/>
            The following error code will be returned:

            <table style="width: 100%; margin: 10px;" border="1" bordercolor="gray">
              <tr>
                <td style="padding-left: 5px; font-style: normal;"><p>ERR_RESTRICTED_ACCESS</p></td>
                <td style="padding-left: 5px;"><p>The access to this endpoint is not allowed for your user</p></td>
              </tr>
            </table>

  /sorters:
    get:
      summary: /sorters
      produces:
        - application/json
      description: >-
        returns all available sorters of the wearparts article search<br>
        sorting works by giving an sort option (see response) + a sort direction (asc/desc)<br>
        example: sort[price]=asc
      security:
        - tokenAuth: []
      responses:
        '200':
          description: returns all available sorters of the article search
          schema:
            type: object
            required:
              - relevance
              - top_seller
              - price
              - manufacturer_name
              - article_name
            properties:
              relevance:
                type: string
                description: sort by calculated score
              top_seller:
                type: string
                description: sort by most sold
              price:
                type: string
                description: sort by price
              manufacturer_name:
                type: string
                description: sort by manufacturer name
              article_name:
                type: string
                description: sort by article name
            example:
              'relevance': Nach Relevanz sortieren
              'top_seller': Nach meistverkauften Artikel sortieren
              'price': Nach Preis sortieren
              'manufacturer_name': Nach Marke sortieren
              'article_name': Nach Artikelname sortieren
