      - shippingCosts
      - positiveRating
      - supplierLikeStatus
    properties:
      distributorId:
        type: integer
        description: The internal id of the distributor
      distributorType:
        type: integer
      positiveRating:
        type: integer
      supplierLikeStatus:
        type: string
        enum: [positive, negative, neutral]
        default: neutral
        description: "Dealer's personal rating for this supplier"
      hasProfile:
        type: boolean
      dataList:
        type: array
        description: >-
          see https://jira.saitow.ag/wiki/display/MT/%28V1.2+W%29+%5BGET%5D+distributorList for possible values
        items:
          $ref: '#/definitions/DataList'
      country:
        type: string
        description: The name of the country e.g. Deutschland
      countryCode:
        type: string
        description: The 2-letter country iso-code e.g. de
      name:
        type: string
        description: The name of the distributor
      stock:
        type: integer
        description: The stock of the distributor
      priceList:
        type: array
        items:
          $ref: '#/definitions/PriceList'
      orderTerms:
        type: string
      deliveryTerms:
        type: string
      neutralShippingCosts:
        type: number
        format: float
        description: "delivery costs for different shipping address or neutral shipping"
      shippingCosts:
        $ref: '#/definitions/ShippingCosts'

  ShippingCosts:
    type: object
    description: "available shipping types"
    properties:
      shipping_standard:
        $ref: '#/definitions/ShippingCostsItem'
      pickup:
        $ref: '#/definitions/ShippingCostsItem'
      shipping_truck:
        $ref: '#/definitions/ShippingCostsItem'
      shipping_truck_fast:
        $ref: '#/definitions/ShippingCostsItem'
      shipping_spedition:
        $ref: '#/definitions/ShippingCostsItem'
      shipping_spedition_fast:
        $ref: '#/definitions/ShippingCostsItem'

  ShippingCostsItem:
    type: object
    required:
      - price
      - estimatedDelivery
    properties:
      price:
        type: number
        format: float
        example: 2.21
      estimatedDelivery:
        type: string
        example: '2018-10-22'

  DataList:
    type: object
    required:
      - name
      - supported
      - matching
    properties:
      name:
        type: string
      supported:
        type: boolean
      matching:
        type: boolean

  PriceList:
    type: object
    required:
      - id
      - value
      - country_code
      - currency
      - type
      - min_order
    properties:
      id:
        type: integer
      value:
        type: number
        format: float
      country_code:
        type: string
        description: 2-letter iso-code e.g. de
      currency:
        type: string
        description: 3-letter iso currency code e.g. EUR
      type:
        type: string
      min_order:
        type: integer

  GetOrder:
    type: object
    required:
      - articleId
      - price
      - depositPrice
      - wholesalerId
      - shippingMethodId
      - paymentMethodId
      - quantity
    properties:
      articleId:
        type: string
      itemId:
        type: string
        description: The id of the offered item
      manufacturerName:
        type: string
        description: The manufacturer name of the requested article
      brandId:
        type: integer
        description: TecDoc brand id
      price:
        type: number
        format: float
        description: The price of the offer as float value
      depositPrice:
        type: number
      quantity:
        type: integer
      wholesalerId:
        type: integer
        description: The id of the wholesaler
      shippingMethodId:
        type: integer
        description: >-
          The shipping method id. 1 standard shipping; 2  pickup; 3 express -
          tomorrow (truck); 4 express - today (truck); 5  express - tomorrow
          (package); 6 express - today (package)
      paymentMethodId:
        type: integer
        description: >-
          Comma separated list of payment methods-Id's, you also can give only
          one id . If the field is left blank, all payment method are
          considered. 1  SEPA direct debit; 2  advance payment; 3  cash on
          delivery; 5 open payment; 7 invoice (payable within 8 days); 8  open
          payment (SEPA) - used for marketplace orders
      estimatedDelivery:
        type: string
        example: '2018-10-18'

  PostOrderOffer:
    type: object
    properties:
      offer:
        type: array
        items:
          allOf:
            - $ref: '#/definitions/GetOrder'
            - type: object
            - required:
                - articleId
                - price
                - wholesalerId
                - quantity
                - shippingMethodId
                - paymentMethodId
            - properties:
                articleId:
                  type: string
                quantity:
                  type: integer
                  description: the quantity you want to order
                vehicleIdentification:
                  type: string
                  description: >-
                    The parameter vehicleIdentification is optional, so it may be left out.
                    <br /><br />
                    Specification of how to build the vehicleIdentification parameter:<br />
                    Concatenate the following keys retrieved by getVehicles:<br />
                    * carId (e.g. 55092)<br />
                    * manuName (e.g. Audi)<br />
                    * modelName (e.g. A3 (8V1, 8VK))<br />
                    * typeName (e.g. 1.4 TFSI)<br />
                    * powerHpTo (e.g. 122)<br />
                    * yearOfConstrFrom (e.g. 201204 -> 04/2012)<br />
                    * yearOfConstrTo (e.g. 201702 -> 02/2017)<br /><br />
                    <i>Both, yearOfConstrFrom and yearOfConstrTo have to be reformatted to match the following format 'm/Y'. There has to be a hyphen in between yearOfConstrFrom and yearOfConstrTo, also if only yearOfConstrFrom is available.</i><br /><br />
                    Example:<br />
                    55092 Audi A3 (8V1, 8VK) 1.4 TFSI 122 04/2012 -
                articleReference:
                  type: string
                  description: >-
                    The parameter articleReference is optional, so it may be left out.
                    <br /><br />
                    With this parameter you can set a reference for every article.

