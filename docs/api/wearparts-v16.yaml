definitions:
  Manufacturers:
    type: object
    required:
      - manuId
      - manuName
      - featured
      - image
    properties:
      manuId:
        type: integer
        description: Vehicle manufacturer id
      manuName:
        type: string
        description: Vehicle manufacturer name
      featured:
        type: boolean
        description: Is the vehicle manufacturer featured?
      image:
        type: string
        description: Image url for the vehicle manufacturers image

  ModelSeries:
    type: object
    required:
      - modelId
      - modelname
      - yearOfConstrFrom
    properties:
      modelId:
        type: integer
        description: Vehicle model id
      modelname:
        type: string
        description: Vehicle model name
      yearOfConstrFrom:
        type: integer
        description: Vehicle model construction date from
      yearOfConstrTo:
        type: integer
        description: Vehicle model construction date to

  Vehicles:
    type: object
    required:
      - carId
      - vehicleDetails
    properties:
      carId:
        type: integer
