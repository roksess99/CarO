swagger: '2.0'
info:
  version: '1.6'
  title: Tyre24.com REST API Version 1.6 Wearparts
  description: |
    TYRE 24 REST API Version V1.6 Wearparts

    All API commands need a TOKEN.
host: ''
basePath: /de/de/rest/V16/wearparts
schemes:
  - https
produces:
  - application/json
consumes:
  - application/json
securityDefinitions:
  tokenAuth:
    type: apiKey
    in: header
    name: X-AUTH-TOKEN
    description: |
      To enable you to log in to ALZURA.com via an interface using third-party systems
      such as your ERP, ERP, DMS or other systems, you generate a unique token [here](https://tyre24.alzura.com/de/de/tokenmanagement),
      which you store in the respective system in order to log in automatically.
      You only need this one token and can use it in several systems.

      **Managing Access with Your ALZURA Account**
        1. **Linked Platforms, Websites, and Apps**  
           - You use your ALZURA account to log in to various services, platforms, and applications.  

        2. **Access Permissions**  
           - When you log in using your ALZURA account, you grant these services access to certain data.  
           - This data may include confidential information.  

        3. **Where to Find Your Tokens**  
           - Follow these steps to locate and manage your tokens:  
             1. Log in to your ALZURA account.  
             2. Navigate to the [Token Management Page](https://tyre24.alzura.com/de/de/tokenmanagement).  

        4. **Token Validity and Expiration**  
           - A token determines how long you remain logged in to an external service.  
           - Once the token expires, you will need to log in again to refresh it.  

        5. **Re-establishing Access**  
           - If you remove access, you can log in again to the service at any time using your ALZURA account.  
           - Re-login will grant access to the service once more.  

      Once you have obtained your API-Token, use it in the X-AUTH-TOKEN header of your requests.
         Example:
        ```
          GET /api/v1/tyres HTTP/1.1
          X-AUTH-TOKEN:<your-api-token>
        ```
paths:
  /manufacturers:
    get:
      summary: /manufacturers
      produces:
        - application/json
      description: >-
        Returns a list of manufacturers.
      security:
        - tokenAuth: []
      parameters:
        - in: query
          name: linkingTargetType
          description: >-
            defines the type

            <table style="width: 100px; margin: 10px;" border="1" bordercolor="gray">
              <tr>
                <td style="text-align: center;"><p>P</p></td>
                <td style="padding-left: 5px;"><p>PKW (default)</p></td>
              </tr>
              <tr>
                <td style="text-align: center;"><p>M</p></td>
                <td style="padding-left: 5px;"><p>Motor</p></td>
              </tr>
              <tr>
                <td style="text-align: center;"><p>O</p></td>
                <td style="padding-left: 5px;"><p>LKW</p></td>
              </tr>
            </table>
          required: false
          type: string
          default: 'P'
      responses:
        '200':
          description: >-
            Returns a list of manufacturers.
          schema:
            type: array
            items:
              $ref: '#/definitions/Manufacturers'
        '403':
          description: >-
            The access to this endpoint is restricted for your user
            <br /><br/>
            The following error code will be returned:

            <table style="width: 100%; margin: 10px;" border="1" bordercolor="gray">
              <tr>
                <td style="padding-left: 5px; font-style: normal;"><p>ERR_RESTRICTED_ACCESS</p></td>
                <td style="padding-left: 5px;"><p>The access to this endpoint is not allowed for your user</p></td>
              </tr>
            </table>

  /modelSeries:
    get:
      summary: /modelSeries
      produces:
        - application/json
      description: >-
        Returns models for a specified manufacturer.
      security:
        - tokenAuth: []
      parameters:
        - in: query
          name: manufacturerId
          description: Manufacturer id from manufacturer selection
          required: true
          type: integer
        - in: query
          name: linkingTargetType
          description: >-
            defines the type

            <table style="width: 100px; margin: 10px;" border="1" bordercolor="gray">
              <tr>
                <td style="text-align: center;"><p>P</p></td>
                <td style="padding-left: 5px;"><p>PKW (default)</p></td>
              </tr>
              <tr>
                <td style="text-align: center;"><p>M</p></td>
                <td style="padding-left: 5px;"><p>Motor</p></td>
              </tr>
              <tr>
                <td style="text-align: center;"><p>O</p></td>
                <td style="padding-left: 5px;"><p>LKW</p></td>
              </tr>
            </table>
          required: false
          type: string
          default: 'P'
      responses:
        '200':
          description: Returns models for a specified manufacturer.
          schema:
            type: array
            items:
              $ref: '#/definitions/ModelSeries'
        '403':
          description: >-
            The access to this endpoint is restricted for your user
            <br /><br/>
            The following error code will be returned:

            <table style="width: 100%; margin: 10px;" border="1" bordercolor="gray">
              <tr>
                <td style="padding-left: 5px; font-style: normal;"><p>ERR_RESTRICTED_ACCESS</p></td>
                <td style="padding-left: 5px;"><p>The access to this endpoint is not allowed for your user</p></td>
              </tr>
            </table>

  /vehicles:
    get:
      summary: vehicles
      produces:
        - application/json
      description: Returns vehicle details for a specific manufacturer and model.
      security:
        - tokenAuth: []
      parameters:
        - in: query
          name: manufacturerId
          description: Manufacturer id from manufacturer selection
          required: true
          type: integer
        - in: query
          name: modelId
          description: Model id from model selection
          required: true
          type: integer
        - in: query
          name: linkingTargetType
          description: >-
            defines the type

            <table style="width: 100px; margin: 10px;" border="1" bordercolor="gray">
              <tr>
                <td style="text-align: center;"><p>P</p></td>
                <td style="padding-left: 5px;"><p>PKW (default)</p></td>
              </tr>
              <tr>
                <td style="text-align: center;"><p>M</p></td>
                <td style="padding-left: 5px;"><p>Motor</p></td>
              </tr>
              <tr>
                <td style="text-align: center;"><p>O</p></td>
                <td style="padding-left: 5px;"><p>LKW</p></td>
              </tr>
            </table>
          required: false
          type: string
          default: 'P'
      responses:
        '200':
          description: Returns vehicle details for a specific manufacturer and model.
          schema:
            type: array
            items:
              $ref: '#/definitions/Vehicles'
        '403':
          description: >-
            The access to this endpoint is restricted for your user
            <br /><br/>
            The following error code will be returned:

            <table style="width: 100%; margin: 10px;" border="1" bordercolor="gray">
              <tr>
                <td style="padding-left: 5px; font-style: normal;"><p>ERR_RESTRICTED_ACCESS</p></td>
                <td style="padding-left: 5px;"><p>The access to this endpoint is not allowed for your user</p></td>
              </tr>
            </table>

  /vehicleByKey:
    get:
      summary: /vehicleByKey
      produces:
        - application/json
      description: Returns vehicle ids by searching with key system numbers.
      security:
        - tokenAuth: []
      parameters:
        - in: query
