# Platte node_modules zonder symlinks.
#
# GEMETEN 2026-09-12 bij de eerste deploy op Hostinger: de applicatie startte
# niet en gaf
#
#   Cannot find module '@swc/helpers/_/_interop_require_default'
#   required from node_modules/next/dist/client/lib/console.js
#
# Standaard zet pnpm in `node_modules` alleen symlinks naar `node_modules/.pnpm`,
# waar elk pakket zijn eigen afhankelijkheden naast zich heeft staan.
# `@swc/helpers` hoort bij Next en staat dus in `.pnpm/next@…/node_modules/`,
# niet bovenin. Node vindt hem alleen omdat de zoektocht begint op het échte
# pad waar de symlink naar wijst.
#
# Hostinger kopieert elke deploy naar een eigen map (`hbuilds/versions/<uuid>/`)
# en pakt die symlinks daarbij uit: `node_modules/next` werd een echte map, los
# van de afhankelijkheden die ernaast hoorden te staan. In de stacktrace stonden
# daardoor twee kopieën van Next.
#
# Hiermee schrijft pnpm alles plat in `node_modules`, zoals npm dat doet. Er zijn
# dan geen symlinks meer om te verliezen. Het kost wat schijfruimte; dat weegt
# niet op tegen een winkel die na een deploy niet start.
#
# LET OP: dit hoort hier en niet in `.npmrc`. pnpm 11 leest zijn eigen
# instellingen uit dit bestand — in `.npmrc` blijft `node-linker=hoisted`
# stilletjes zonder effect (`pnpm config get node-linker` gaf `undefined`).
nodeLinker: hoisted

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@next/env@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - next@16.3.8
  - '@next/eslint-plugin-next@16.3.8'
  - eslint-config-next@16.3.8

# Kwetsbaarheden in pakketten die wij niet zelf kiezen.
#
# Deze vier zitten diep in de boom — onder `next` en onder `eslint` — en zijn
# dus niet met `pnpm add` te verhelpen. Een override dwingt de gerepareerde
# versie af binnen hetzelfde hoofdnummer, dus zonder breuk. De aanleiding is
# de scan van Hostinger, 2026-10-01 (@docs/DECISIONS.md #23).
#
# Haal een regel hier weg zodra de tussenliggende afhankelijkheid zelf
# bijgewerkt is; `pnpm audit` zegt dan nog steeds niets, en één laag minder
# eigen ingrepen is er één.
overrides:
  # Stapeloverloop bij diep geneste accolades in een glob-patroon (DoS)
  brace-expansion@1: ^1.1.21
  brace-expansion@5: ^5.0.12
  # Prototype- en parserproblemen in de 4-reeks
  js-yaml@4: ^4.3.2
  # Voorspelbare id's; zit onder postcss, dat onder next hangt
  nanoid@3: ^3.3.19
